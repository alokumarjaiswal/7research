AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda SnapStart Research - ML Inference Workload
Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        MODEL_PATH: /opt/models
Resources:
  MLInferenceBaseline:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-inference-baseline
      CodeUri: MLInferenceBaseline
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      Environment:
        Variables:
          FUNCTION_TYPE: baseline
      Events:
        InferenceAPI:
          Type: Api
          Properties:
            Path: /predict/baseline
            Method: post
    Metadata:
      SamResourceId: MLInferenceBaseline
  MLInferenceSnapStart:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ml-inference-snapstart
      CodeUri: MLInferenceSnapStart
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - x86_64
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          FUNCTION_TYPE: snapstart
      Events:
        InferenceAPI:
          Type: Api
          Properties:
            Path: /predict/snapstart
            Method: post
    Metadata:
      SamResourceId: MLInferenceSnapStart
Outputs:
  BaselineAPI:
    Description: API Gateway endpoint for baseline function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/predict/baseline
  SnapStartAPI:
    Description: API Gateway endpoint for SnapStart function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/predict/snapstart
  BaselineFunctionArn:
    Description: Baseline Lambda Function ARN
    Value:
      Fn::GetAtt:
      - MLInferenceBaseline
      - Arn
  SnapStartFunctionArn:
    Description: SnapStart Lambda Function ARN
    Value:
      Fn::GetAtt:
      - MLInferenceSnapStart
      - Arn
  BaselineLogGroup:
    Description: CloudWatch Log Group for Baseline
    Value:
      Fn::Sub: /aws/lambda/${MLInferenceBaseline}
  SnapStartLogGroup:
    Description: CloudWatch Log Group for SnapStart
    Value:
      Fn::Sub: /aws/lambda/${MLInferenceSnapStart}
